<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Visual puzzles</title>
<link rel="manifest" href="../../manifest.json"><meta name="theme-color" content="#0B6E69">
<link rel="apple-touch-icon" href="../../../../icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--teal:#0B6E69;--teal-d:#0B4F4B;--tint:#E3F2F0;--bg:#F6F7F9;--ink:#111827;--mut:#4B5563;--line:#C5CCD6;--warn:#B8460F;--warn-t:#FBEBE3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:16px 16px 0;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.02em}
h2{margin:0;font-size:20px;line-height:1.3}
p{margin:0}
.mut{color:var(--mut);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:10px;background:var(--tint);color:var(--teal-d);font-weight:600;font-size:14px}
button,.btn{font:inherit;cursor:pointer}
.primary{display:flex;align-items:center;justify-content:center;min-height:52px;width:100%;border:0;border-radius:10px;background:var(--teal);color:#fff;font-size:17px;font-weight:600;text-decoration:none}
.primary:disabled{background:#9AA5B4;cursor:not-allowed}
.ghost{text-decoration:none;display:flex;align-items:center;justify-content:center;min-height:48px;width:100%;border:1.5px solid var(--teal);border-radius:10px;background:#fff;color:var(--teal);font-weight:600}
.link{min-height:44px;border:0;background:none;color:var(--teal);font-weight:600;text-decoration:underline}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;text-align:left;color:var(--ink)}
.opt .k{flex:0 0 32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#EEF1F5;font-weight:700}
.opt.sel{border-color:var(--teal);background:var(--tint)}
.opt.ok{border-color:var(--teal);background:var(--tint)}.opt.ok .k{background:var(--teal);color:#fff}
.opt.bad{border-color:var(--warn);background:var(--warn-t)}.opt.bad .k{background:var(--warn);color:#fff}
.opt:focus-visible,.primary:focus-visible,.ghost:focus-visible,.link:focus-visible{outline:3px solid #1B1B1B;outline-offset:2px}
.bar{height:8px;border-radius:4px;background:#E3E7ED;overflow:hidden}.bar>i{display:block;height:100%;background:var(--teal)}
.card{padding:14px 16px;border-radius:10px;background:#fff;border:1px solid #E3E7ED}
.box{padding:14px 16px;border-radius:10px;background:var(--warn-t);border:1px solid var(--warn)}
.score{font-size:56px;font-weight:700;letter-spacing:-.03em;color:var(--teal-d)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
[hidden]{display:none!important}
.dock{position:sticky;bottom:0;margin:0 -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid #E3E7ED}
.dock .primary{min-height:60px;font-size:18px}
#fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:50}
#fxmsg{position:fixed;left:0;right:0;bottom:22%;display:flex;justify-content:center;padding:0 16px;pointer-events:none;z-index:60}
#msg{font-weight:600;padding:10px 18px;border-radius:12px;text-align:center;max-width:92%}#msg:empty{display:none}
.lvl{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:0;border-radius:18px;background:var(--tint);color:var(--teal-d);font-weight:700;font-size:14px}
.lvl:focus-visible,.cbar:focus-visible,.sheet button:focus-visible{outline:3px solid #1B1B1B;outline-offset:2px}
.xp{height:10px;border-radius:5px;background:#E3E7ED;overflow:hidden}.xp>i{display:block;height:100%;background:linear-gradient(90deg,#1D9E75,#EF9F27)}
.chart{display:flex;gap:6px;align-items:flex-end;height:112px;border-bottom:1.5px solid #C5CCD6;padding:0 2px}
.cbar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;padding:0;border:0;background:none;color:var(--ink);font:inherit}
.cbar .v{font-size:12px;font-weight:700;min-height:16px}.cbar .col{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--teal)}
.cbar.low .col{background:#EF9F27}.cbar.missed .col{background:#EF9F27;opacity:.6;border-radius:2px}.cbar.none .col{background:none;border:1.5px dashed #AEB6C2;border-radius:6px}.cbar.today .col{box-shadow:0 0 0 2px var(--tint),0 0 0 4px var(--teal)}
.cbar .d{font-size:11px;color:var(--mut)}
.sheetback{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:85vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border-radius:10px;border:1.5px solid transparent}.lrow .n{flex:1;font-weight:600}.lrow .p{color:var(--mut);font-size:14px}
.lrow.now{border-color:var(--teal);background:var(--tint)}.lrow.locked{color:var(--mut)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--teal);color:#fff}
.logo{display:block;width:210px;max-width:62%;height:auto;margin:0 auto}.logo.small{width:84px;margin:0 auto 2px}.logo.mid{width:120px;margin:0 auto}
.printlogo{display:none}
@media print{body{background:#fff}.dock,.lvl,.soundbtn,#fx,#fxmsg{display:none!important}.printlogo{display:block;width:150px;margin:0 auto 8px}.logo{display:none}}
.soundbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;border-radius:22px;border:2px solid;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.soundbtn svg{width:24px;height:24px;flex:none}.soundbtn.on{background:#0B6E69;border-color:#0B6E69;color:#fff}.soundbtn.off{background:#fff;border-color:#B4B2A9;color:#6B7280}

.kind{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px}
.pic{border-radius:14px;background:#F4E6D6;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px}
.pr{display:flex;gap:18px;justify-content:center;align-items:flex-end}
.pc{display:flex;flex-direction:column;align-items:center}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1.1}
.pd{width:76px;height:12px;border-radius:7px;background:#D8BFA2;border:2px solid #B99B7C;margin-top:2px}
.slots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:4px 0}
.sl{width:30px;height:40px;border-radius:8px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:#fff;padding:0;color:var(--ink)}
.sl.on{background:var(--tint);border-color:var(--teal)}.sl.ok{background:var(--teal);border-color:var(--teal);color:#fff}.sl.bad{background:var(--warn-t);border-color:var(--warn);color:var(--warn)}
.tl{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:40px;gap:6px}
.t{border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:18px;font-weight:700;padding:0;color:var(--ink)}
.t.used{opacity:.25}
.t:focus-visible,.sl:focus-visible{outline:3px solid #1B1B1B;outline-offset:2px}
.mini{display:flex;gap:8px}.mini button{flex:1;min-height:36px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.strip div{background:#fff;border:1px solid #E3E7ED;border-radius:10px;padding:6px 10px}.strip small{display:block;font-size:11px;color:#4B5563}.strip b{font-size:16px;color:#0B6E69}.strip b.n{color:var(--ink)}
.fbtns{display:flex;gap:8px}.fb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:54px;padding:5px 4px;border-radius:14px;border:2px solid;font:inherit;line-height:1.15;cursor:pointer;transition:transform .12s,box-shadow .12s}.fb:active{transform:scale(.97)}.fb .ic{font-size:17px}.fb b{font-size:14px}.fb small{font-size:11px;opacity:.85}
.fb.hintb{background:linear-gradient(180deg,#FFF6E3,#FAEEDA);border-color:#BA7517;color:#633806;box-shadow:0 2px 0 #BA7517}.fb.sosb{background:linear-gradient(180deg,#E9F8F2,#DDF3EA);border-color:#0F6E56;color:#085041;box-shadow:0 2px 0 #0F6E56}.fb.revb{background:linear-gradient(180deg,#F4F3FF,#EEEDFE);border-color:#534AB7;color:#3C3489;box-shadow:0 2px 0 #534AB7}.fb:active{box-shadow:0 1px 0 currentColor}
.hint{padding:10px 12px;border-radius:10px;background:#EEF1F5;color:var(--ink);font-size:15px}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:sh .3s}
</style>
</head>

}
function code(){ return btoa(unescape(encodeURIComponent(JSON.stringify(payload())))); }
function finish(){ var o = load(OUT) || []; if (!o.some(function(p){return p.quiz===Q.quiz_id;})) { o.push(payload()); save(OUT,o); } flush(); }
function flush(){
  var o = load(OUT) || []; if (!o.length || !INBOX) return;
  var left = o.slice(), pending = o.length;
  o.forEach(function(p){
    fetch(INBOX,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)}).then(function(){
      left = left.filter(function(x){return x.quiz!==p.quiz;}); save(OUT,left);
      if (p.quiz === Q.quiz_id) { st.sent = true; save(KEY,st); if (st.done) render(); }
    }).catch(function(){ if (--pending === 0 && st.done) render(); });
  });
}
function renderScore(){
  var s = solvedCount(), n = qs.length;
  app.appendChild(el("div",{class:"row"},[el("span",{class:"mut",text:Q.date}), el("span",{class:"kind",text:"Visual puzzles"})]));
  app.appendChild(el("div",{class:"score",text:s + " / " + n}));
  app.appendChild(el("h2",{text: G ? (s === n ? "Perfect, " : G.tiers[tierIndex()].name + ", ") + Q.user_name + "!" : s === n ? "Perfect, " + Q.user_name + "!" : "Good effort, " + Q.user_name}));
  var card = el("div",{class:"card",style:"display:flex;flex-direction:column;gap:10px"});
  qs.forEach(function(q,i){
    var won = st.solved[i] === true;
    card.appendChild(el("div",{class:"row"},[el("span",{text:q.answer}), el("strong",{text: won ? (G ? "+" + one(i) : "solved") : "missed"})]));
  });
  app.appendChild(card);
  if (G) {
    app.appendChild(el("div",{class:"card",style:"display:flex;flex-direction:column;gap:8px"},[
      el("div",{class:"row"},[el("strong",{text:"+" + (st.pts || 0) + " stars"}), levelChip()]), levelBar(),
      el("div",{class:"mut",text:(G.streak + 1) + (G.streak ? " sets" : " set") + " in a row"})]));
    app.appendChild(chartCard());
  }
  var more = el("details",{class:"card"},[el("summary",{text:"Having trouble submitting?",style:"cursor:pointer;font-weight:600"}),
    el("p",{class:"mut",style:"margin:8px 0",text:"Your result is saved on this phone and sends by itself when you are online. You can also send it yourself:"})]);
  if (MAIL) more.appendChild(el("a",{class:"ghost",style:"margin-bottom:8px",text:"Send by email",href:"mailto:" + MAIL + "?subject=" + encodeURIComponent("Puzzle result " + Q.quiz_id) + "&body=" + encodeURIComponent(code())}));
  more.appendChild(el("button",{class:"ghost",text:"Copy result code",onclick:function(e){
    var b = e.currentTarget, c = code();
    (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject()).then(function(){ b.textContent="Copied"; }, function(){ window.prompt("Copy this code", c); });
  }}));
  app.appendChild(more);
  app.appendChild(el("div",{style:"flex:1"}));
  var dock = el("div",{class:"dock"});
  if (Q.next) dock.appendChild(el("button",{class:"primary",text:"Take another puzzle set",onclick:function(){
    flush(); setTimeout(function(){ location.href = Q.next; }, 350);     // the result is queued first; the next page sends anything left
  }}));
  dock.appendChild(el("button",{class:Q.next ? "link" : "primary",text:"Submit and close",onclick:function(){
    flush(); st.closed=true; save(KEY,st); render();
    setTimeout(function(){ try{ window.close(); }catch(e){} }, 400);
  }}));
  app.appendChild(dock);
}
window.addEventListener("online", flush);
if (st.done && typeof st.pts !== "number") { st.pts = earn(); save(KEY, st); }   // a finished quiz saved by an older page has no points yet
render(); flush();
})();
</script>
