  var host = document.getElementById('kl'), D = JSON.parse(document.getElementById('kl-data').textContent), enc = new TextEncoder();
  var CK = 'kup_code_' + D.p, DK = 'kup_dev';

    if (!d || d.length < 8) { var a = new Uint8Array(12); crypto.getRandomValues(a); d = Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); put(DK, d); }

  }
