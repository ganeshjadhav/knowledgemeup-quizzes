AYp3v52ZBU2k786MjmBFT", "i": 100000}</script><script>(function () {
  var host = document.getElementById('kl'), D = JSON.parse(document.getElementById('kl-data').textContent), enc = new TextEncoder();
  var CK = 'kup_code_' + D.p, DK = 'kup_dev';
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function devId() {
    var d = get(DK);
    if (!d || d.length < 8) { var a = new Uint8Array(12); crypto.getRandomValues(a); d = Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); put(DK, d); }

  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }

  }
  var LOGO = location.pathname.slice(0, Math.max(0, location.pathname.indexOf('/u/'))) + '/icons/logo.webp';
  var CSS = 'body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111827}#kl{max-width:420px;margin:0 auto;min-height:100vh;padding:28px 20px;box-sizing:border-box;display:flex;flex-direction:column}' +
