    'input{width:100%;box-sizing:border-box;font:600 18px ui-monospace,Menlo,monospace;letter-spacing:.04em;text-align:center;padding:14px 8px;border:2px solid #0B6E69;border-radius:12px;background:#fff;color:#0B6E69}input.bad{border-color:#B91C1C;color:#B91C1C}' +

  function screen(title, text, extra) {

    host.querySelector('h1').textContent = title; host.querySelector('p').textContent = text;
    var x = host.querySelector('#kx'); if (extra) extra(x); return x;
  }
  function askCode(err, tried) {
    screen('Enter your code', 'Your code is in the message that sent you this app. Type it or paste it.', function (x) {
      x.innerHTML = '<input id="kc" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX"><div class="err" id="ke" hidden></div>' +
        '<div class="note">If you tapped your personal link, you will not see this screen: the app uses the code in the link by itself and remembers it on this phone.</div><div class="sp"></div><button id="kg">Unlock</button>';
      var i = x.querySelector('#kc'), e = x.querySelector('#ke'), go = function () {
        var v = i.value.trim(); if (!v) return;
        tryCodes([v, v.toUpperCase()]).then(function (r) { put(CK, r.code); start(r); }, function () {
          i.classList.add('bad'); e.hidden = false; e.textContent = 'That code does not match. Check it and try again.'; });
      };
      x.querySelector('#kg').onclick = go; i.onkeydown = function (ev) { if (ev.key === 'Enter') go(); };
      if (tried) { i.value = tried; i.classList.add('bad'); e.hidden = false; e.textContent = 'That code does not match. Check it and try again.'; }
    });
  }
  function blocked(lm) {
    screen('Already used on other devices', 'This link is already set up on ' + lm + ' device' + (lm == 1 ? '' : 's') + ', which is the most allowed. Ask the person who runs your quizzes to reset your devices or send you a new link.', function (x) {
      x.innerHTML = '<div class="note">Using a new phone? Ask for a device reset and open your link again.</div><div class="sp"></div><button class="alt" id="kr">Try again</button>';
      x.querySelector('#kr').onclick = function () { location.reload(); };
    });
  }
  function start(r) {
    var pl = r.pl, id = devId(), dv = pl.dv || [], bl = pl.bl || [], lm = pl.lm || 0, known = dv.indexOf(id) >= 0;
    if (bl.indexOf(id) >= 0 || (!known && lm > 0 && dv.length >= lm)) { blocked(lm); return; }
    if (!known && pl.ib) {
      var k = 'kup_claim_' + D.p, last = +get(k) || 0;
      if (Date.now() - last > 6 * 3600 * 1000) {
        put(k, String(Date.now()));
        try { fetch(pl.ib, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({v: 1, type: 'device', u: r.code, d: id, n: label(), at: new Date().toISOString()})}); } catch (e) {}
      }
    }
    document.open(); document.write(pl.h); document.close();
  }
  var h = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
  // the code stays in the address on purpose: on an iPhone, Add to Home Screen copies the address it is given, so the installed app starts with the code
  var stored = get(CK);
  tryCodes([h, h.toUpperCase(), stored]).then(function (r) { put(CK, r.code); start(r); }, function () { askCode(null, h || null); });
})();
